<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公考申论素材助手</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">📝 申论素材助手</div>
  <nav id="tabs">
    <button class="tab active" data-tab="hotspots">今日热点</button>
    <button class="tab" data-tab="cards">话题卡</button>
    <button class="tab" data-tab="phrases">语段库</button>
    <button class="tab" data-tab="expressions">表达库</button>
    <button class="tab" data-tab="framework">框架</button>
    <button class="tab" data-tab="review">复习</button>
    <button class="tab" data-tab="settings">设置</button>
  </nav>
  <div id="overview" class="overview"></div>
</header>

<main id="content">
  <!-- 今日热点 -->
  <section id="panel-hotspots" class="panel active">
    <div class="toolbar">
      <input id="hs-q" class="search" placeholder="搜索标题/要点/金句…">
      <input id="hs-date" type="date" title="按日期筛选">
      <select id="hs-status">
        <option value="">全部状态</option>
        <option value="草稿">待审核（草稿）</option>
        <option value="已入库">已入库</option>
      </select>
      <button id="hs-refresh" class="btn">刷新</button>
      <span class="spacer"></span>
      <button id="hs-add" class="btn primary">＋ 手动录入</button>
      <button id="hs-run" class="btn accent">⚡ 立即生成今日</button>
    </div>
    <div id="hs-list" class="card-list"></div>
  </section>

  <!-- 话题卡 -->
  <section id="panel-cards" class="panel">
    <div class="toolbar">
      <input id="tc-q" class="search" placeholder="搜索话题/背景/对策…">
      <select id="tc-theme"></select>
      <select id="tc-status">
        <option value="">全部状态</option>
        <option value="草稿">待审核（草稿）</option>
        <option value="已入库">已入库</option>
      </select>
      <button id="tc-refresh" class="btn">刷新</button>
      <span class="spacer"></span>
      <button id="tc-add" class="btn primary">＋ 手动录入</button>
    </div>
    <div id="tc-list" class="card-list"></div>
  </section>

  <!-- 语段库 -->
  <section id="panel-phrases" class="panel">
    <div class="toolbar wrap">
      <input id="ph-q" class="search" placeholder="搜索语段/适用场景…">
      <div class="filters">
        <div class="filter-group" id="f-position">
          <span class="fg-label">位置</span>
        </div>
        <div class="filter-group" id="f-theme">
          <span class="fg-label">主题</span>
        </div>
        <div class="filter-group" id="f-technique">
          <span class="fg-label">手法</span>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="ph-collected"> 只看收藏</label>
      <button id="ph-refresh" class="btn">刷新</button>
      <span class="spacer"></span>
      <button id="ph-add" class="btn primary">＋ 新增语段</button>
    </div>
    <div id="ph-list" class="card-list"></div>
  </section>

  <!-- 表达库 -->
  <section id="panel-expressions" class="panel">
    <div class="toolbar wrap">
      <input id="ex-q" class="search" placeholder="搜索规范词/好词/平易词…">
      <div class="filters">
        <div class="filter-group" id="f-kind">
          <span class="fg-label">类型</span>
        </div>
        <div class="filter-group" id="f-extheme">
          <span class="fg-label">主题</span>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="ex-collected"> 只看收藏</label>
      <button id="ex-refresh" class="btn">刷新</button>
      <span class="spacer"></span>
      <button id="ex-add" class="btn primary">＋ 新增表达</button>
    </div>
    <div id="ex-list" class="card-list"></div>
  </section>

  <!-- 框架 -->
  <section id="panel-framework" class="panel">
    <div class="fw-head">
      <h2>申论总体框架</h2>
      <button id="fw-edit-tree" class="btn">✏️ 编辑拆解</button>
      <button id="fw-decompose" class="btn accent">🤖 AI 拆解案例</button>
      <button id="fw-fanwen" class="btn accent">📄 范文模板</button>
    </div>
    <div class="fw-layout">
      <div id="fw-theme-nav" class="fw-nav"></div>
      <div id="fw-content" class="fw-content"></div>
    </div>
    <div id="fanwen-panel" class="fanwen-panel hidden">
      <div class="fw-head" style="margin-top:16px">
        <h2>📄 本地范文 → 模板</h2>
        <button id="fw-fanwen-refresh" class="btn">刷新</button>
      </div>
      <div id="fanwen-stats" class="fanwen-stats"></div>
      <div class="fw-block">
        <h3>🗂 sucai/ 文件（点击直接解析成模板）</h3>
        <div id="fanwen-file-list" class="fw-chips"></div>
      </div>
      <div class="fw-block">
        <h3>🔁 每日轮转队列</h3>
        <div id="fanwen-queue" class="fw-dims"></div>
      </div>
    </div>
  </section>

  <!-- 复习 -->
  <section id="panel-review" class="panel">
    <div class="toolbar">
      <h2 style="margin:0">今日复习</h2>
      <span class="spacer"></span>
      <button id="rv-refresh" class="btn">刷新</button>
    </div>
    <div id="rv-due" class="card-list"></div>
    <div class="rv-section-title" id="rv-random-title">随机抽查</div>
    <div id="rv-random" class="card-list"></div>
    <div class="rv-section-title">复习池（全部）</div>
    <div id="rv-pool" class="card-list"></div>
  </section>

  <!-- 设置 -->
  <section id="panel-settings" class="panel">
    <div class="settings-card">
      <h2>AI 配置</h2>
      <label>API Key
        <input id="cfg-key" type="password" placeholder="sk-...">
      </label>
      <label>API 地址
        <input id="cfg-base" type="text">
      </label>
      <label>模型
        <input id="cfg-model" type="text">
      </label>
      <label>AI 提供商（更多提供商开发中）
        <select id="cfg-provider" style="padding:9px 12px">
          <option value="deepseek">DeepSeek API</option>
        </select>
      </label>
      <h2>每日更新</h2>
      <label>更新时间
        <input id="cfg-time" type="time">
      </label>
      <label>每日热点条数
        <input id="cfg-hot" type="number" min="1" max="20">
      </label>
      <label>每日话题卡条数
        <input id="cfg-cards" type="number" min="1" max="20">
      </label>
      <label>每日语段搜集条数（0=关闭）
        <input id="cfg-phrases" type="number" min="0" max="10">
      </label>
      <label>每日表达提炼条数（0=关闭）
        <input id="cfg-expr" type="number" min="0" max="10">
      </label>
      <label>每日案例搜集条数（0=关闭）
        <input id="cfg-cases" type="number" min="0" max="10">
      </label>
      <label>范文抓取节奏（天/次）
        <input id="cfg-fanwen" type="number" min="1" max="30">
      </label>
      <label>每日随机抽查条数
        <input id="cfg-random" type="number" min="0" max="20">
      </label>
      <label>启动补拉上限（天）
        <input id="cfg-catchup" type="number" min="0" max="7">
      </label>
      <h2>字体大小</h2>
      <label>基础字号（px）
        <input id="cfg-font-base" type="number" min="13" max="18">
      </label>
      <label>重点字号（px，框架/要点/金句/标题加粗）
        <input id="cfg-font-emph" type="number" min="14" max="22">
      </label>
      <div class="row">
        <button id="cfg-save" class="btn primary">保存设置</button>
        <button id="cfg-catch-run" class="btn accent">⚡ 补拉缺失天数</button>
      </div>
      <p class="hint" id="cfg-hint"></p>
    </div>
  </section>
</main>

<!-- 编辑弹窗 -->
<div id="modal-mask" class="mask hidden">
  <div id="modal" class="modal">
    <div class="modal-head">
      <span id="modal-title">编辑</span>
      <button id="modal-close" class="btn ghost">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-foot">
      <button id="modal-cancel" class="btn">取消</button>
      <button id="modal-save" class="btn primary">保存</button>
    </div>
  </div>
</div>

<!-- AI 拆解弹窗 -->
<div id="decompose-mask" class="mask hidden">
  <div id="decompose-modal" class="modal">
    <div class="modal-head">
      <span>AI 辅助拆解案例</span>
      <button id="decompose-close" class="btn ghost">✕</button>
    </div>
    <div class="modal-body">
      <label>粘贴一段社会现象 / 身边小事 / 新闻描述
        <textarea id="dc-desc" style="min-height:120px" placeholder="例如：社区搞垃圾分类但效果差，居民还是混着扔……"></textarea>
      </label>
      <button id="dc-run" class="btn accent">🤖 开始拆解</button>
      <div id="dc-result" class="dc-result"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
